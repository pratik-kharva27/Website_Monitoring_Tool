<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030712"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="3"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.35"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Page background (bg-gray-950) -->
  <rect width="1200" height="760" fill="url(#bg)"/>

  <!-- Header bar (bg-gray-900 border-b border-gray-800) -->
  <rect x="0" y="0" width="1200" height="72" fill="#111827"/>
  <rect x="0" y="71" width="1200" height="1" fill="#1f2937"/>

  <!-- Logo square (bg-brand-600 ~ indigo-600) -->
  <rect x="96" y="18" width="36" height="36" rx="8" fill="#4f46e5"/>
  <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(104,26)">
    <path d="M20 10A8 8 0 1 1 10 2"/>
    <path d="M20 2 10 12"/>
    <path d="M15 2h5v5"/>
  </g>
  <text x="144" y="35" fill="#f3f4f6" font-size="17" font-weight="600">Website Monitor</text>
  <text x="144" y="53" fill="#9ca3af" font-size="13">Track uptime and availability</text>

  <!-- ============== Add website Card ============== -->
  <g filter="url(#shadow)">
    <rect x="96" y="104" width="1008" height="120" rx="12" fill="#111827" stroke="#1f2937"/>
  </g>
  <text x="120" y="134" fill="#f3f4f6" font-size="15" font-weight="600">Add a website</text>
  <text x="120" y="154" fill="#9ca3af" font-size="13">Paste a full URL to start monitoring its status.</text>

  <!-- Input -->
  <rect x="120" y="170" width="780" height="38" rx="8" fill="#0b1220" stroke="#1f2937"/>
  <g stroke="#6b7280" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(132,181)">
    <path d="M8 10a4 4 0 0 0 6 0l2-2a4 4 0 0 0-6-6l-1 1"/>
    <path d="M11 8a4 4 0 0 0-6 0l-2 2a4 4 0 0 0 6 6l1-1"/>
  </g>
  <text x="160" y="194" fill="#6b7280" font-size="13">https://example.com</text>

  <!-- Button (bg-brand-600) -->
  <rect x="912" y="170" width="172" height="38" rx="8" fill="#4f46e5"/>
  <text x="998" y="194" fill="#ffffff" font-size="13" font-weight="600" text-anchor="middle">Add Website</text>

  <!-- ============== Monitored websites Card ============== -->
  <g filter="url(#shadow)">
    <rect x="96" y="248" width="1008" height="472" rx="12" fill="#111827" stroke="#1f2937"/>
  </g>

  <!-- Card header -->
  <text x="120" y="280" fill="#f3f4f6" font-size="15" font-weight="600">Monitored websites</text>
  <text x="120" y="300" fill="#9ca3af" font-size="13">5 sites</text>

  <!-- Search input -->
  <rect x="820" y="266" width="264" height="34" rx="8" fill="#0b1220" stroke="#1f2937"/>
  <g stroke="#6b7280" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(832,277)">
    <circle cx="5" cy="5" r="4"/><path d="m11 11-2.1-2.1"/>
  </g>
  <text x="852" y="288" fill="#6b7280" font-size="13">Search by URL</text>

  <!-- Table header row -->
  <rect x="96" y="320" width="1008" height="44" fill="#1f2937" fill-opacity="0.6"/>
  <text x="120" y="346" fill="#9ca3af" font-size="11" font-weight="700" letter-spacing="1">WEBSITE ▲</text>
  <text x="480" y="346" fill="#9ca3af" font-size="11" font-weight="700" letter-spacing="1">STATUS</text>
  <text x="660" y="346" fill="#9ca3af" font-size="11" font-weight="700" letter-spacing="1">LAST CHECKED</text>
  <text x="1080" y="346" fill="#9ca3af" font-size="11" font-weight="700" letter-spacing="1" text-anchor="end">ACTIONS</text>

  <!-- ==== Row 1 : github.com Up 200 ==== -->
  <line x1="96" y1="364" x2="1104" y2="364" stroke="#1f2937"/>
  <rect x="120" y="378" width="24" height="24" rx="4" fill="#6366f1"/>
  <text x="132" y="395" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">G</text>
  <text x="156" y="390" fill="#f3f4f6" font-size="13" font-weight="600">github.com</text>
  <text x="156" y="406" fill="#9ca3af" font-size="11">https://github.com</text>
  <!-- Status badge: Up · 200 (success) -->
  <rect x="480" y="382" width="92" height="22" rx="11" fill="#14532d" fill-opacity="0.25" stroke="#22c55e" stroke-opacity="0.35"/>
  <circle cx="492" cy="393" r="3" fill="#4ade80"/>
  <text x="500" y="397" fill="#86efac" font-size="11" font-weight="600">Up · 200</text>
  <text x="660" y="397" fill="#9ca3af" font-size="13">a few seconds ago</text>
  <rect x="860" y="378" width="108" height="26" rx="6" fill="#4f46e5"/>
  <text x="914" y="396" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Check Status</text>
  <rect x="976" y="378" width="72" height="26" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="1012" y="396" fill="#e5e7eb" font-size="12" font-weight="600" text-anchor="middle">Visit</text>

  <!-- ==== Row 2 : example.com Up 200 ==== -->
  <line x1="96" y1="420" x2="1104" y2="420" stroke="#1f2937"/>
  <rect x="120" y="434" width="24" height="24" rx="4" fill="#06b6d4"/>
  <text x="132" y="451" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">E</text>
  <text x="156" y="446" fill="#f3f4f6" font-size="13" font-weight="600">example.com</text>
  <text x="156" y="462" fill="#9ca3af" font-size="11">https://example.com</text>
  <rect x="480" y="438" width="92" height="22" rx="11" fill="#14532d" fill-opacity="0.25" stroke="#22c55e" stroke-opacity="0.35"/>
  <circle cx="492" cy="449" r="3" fill="#4ade80"/>
  <text x="500" y="453" fill="#86efac" font-size="11" font-weight="600">Up · 200</text>
  <text x="660" y="453" fill="#9ca3af" font-size="13">34 seconds ago</text>
  <rect x="860" y="434" width="108" height="26" rx="6" fill="#4f46e5"/>
  <text x="914" y="452" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Check Status</text>
  <rect x="976" y="434" width="72" height="26" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="1012" y="452" fill="#e5e7eb" font-size="12" font-weight="600" text-anchor="middle">Visit</text>

  <!-- ==== Row 3 : api.mystore.dev Down 500 ==== -->
  <line x1="96" y1="476" x2="1104" y2="476" stroke="#1f2937"/>
  <rect x="120" y="490" width="24" height="24" rx="4" fill="#ec4899"/>
  <text x="132" y="507" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">A</text>
  <text x="156" y="502" fill="#f3f4f6" font-size="13" font-weight="600">api.mystore.dev</text>
  <text x="156" y="518" fill="#9ca3af" font-size="11">https://api.mystore.dev/health</text>
  <!-- Status badge: Down · 500 (danger) -->
  <rect x="480" y="494" width="104" height="22" rx="11" fill="#7f1d1d" fill-opacity="0.25" stroke="#ef4444" stroke-opacity="0.35"/>
  <circle cx="492" cy="505" r="3" fill="#f87171"/>
  <text x="500" y="509" fill="#fca5a5" font-size="11" font-weight="600">Down · 500</text>
  <text x="660" y="509" fill="#9ca3af" font-size="13">1 minute ago</text>
  <rect x="860" y="490" width="108" height="26" rx="6" fill="#4f46e5"/>
  <text x="914" y="508" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Check Status</text>
  <rect x="976" y="490" width="72" height="26" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="1012" y="508" fill="#e5e7eb" font-size="12" font-weight="600" text-anchor="middle">Visit</text>

  <!-- ==== Row 4 : shopify.com Up 200 ==== -->
  <line x1="96" y1="532" x2="1104" y2="532" stroke="#1f2937"/>
  <rect x="120" y="546" width="24" height="24" rx="4" fill="#10b981"/>
  <text x="132" y="563" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">S</text>
  <text x="156" y="558" fill="#f3f4f6" font-size="13" font-weight="600">shopify.com</text>
  <text x="156" y="574" fill="#9ca3af" font-size="11">https://shopify.com</text>
  <rect x="480" y="550" width="92" height="22" rx="11" fill="#14532d" fill-opacity="0.25" stroke="#22c55e" stroke-opacity="0.35"/>
  <circle cx="492" cy="561" r="3" fill="#4ade80"/>
  <text x="500" y="565" fill="#86efac" font-size="11" font-weight="600">Up · 200</text>
  <text x="660" y="565" fill="#9ca3af" font-size="13">2 minutes ago</text>
  <rect x="860" y="546" width="108" height="26" rx="6" fill="#4f46e5"/>
  <text x="914" y="564" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Check Status</text>
  <rect x="976" y="546" width="72" height="26" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="1012" y="564" fill="#e5e7eb" font-size="12" font-weight="600" text-anchor="middle">Visit</text>

  <!-- ==== Row 5 : broken-site.test Down 404 ==== -->
  <line x1="96" y1="588" x2="1104" y2="588" stroke="#1f2937"/>
  <rect x="120" y="602" width="24" height="24" rx="4" fill="#f59e0b"/>
  <text x="132" y="619" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">B</text>
  <text x="156" y="614" fill="#f3f4f6" font-size="13" font-weight="600">broken-site.test</text>
  <text x="156" y="630" fill="#9ca3af" font-size="11">https://broken-site.test/missing</text>
  <rect x="480" y="606" width="104" height="22" rx="11" fill="#7f1d1d" fill-opacity="0.25" stroke="#ef4444" stroke-opacity="0.35"/>
  <circle cx="492" cy="617" r="3" fill="#f87171"/>
  <text x="500" y="621" fill="#fca5a5" font-size="11" font-weight="600">Down · 404</text>
  <text x="660" y="621" fill="#9ca3af" font-size="13">3 minutes ago</text>
  <rect x="860" y="602" width="108" height="26" rx="6" fill="#4f46e5"/>
  <text x="914" y="620" fill="#fff" font-size="12" font-weight="600" text-anchor="middle">Check Status</text>
  <rect x="976" y="602" width="72" height="26" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="1012" y="620" fill="#e5e7eb" font-size="12" font-weight="600" text-anchor="middle">Visit</text>

  <!-- Pagination -->
  <line x1="96" y1="660" x2="1104" y2="660" stroke="#1f2937"/>
  <text x="120" y="692" fill="#9ca3af" font-size="13">Page <tspan fill="#f3f4f6" font-weight="600">1</tspan> of <tspan fill="#f3f4f6" font-weight="600">1</tspan></text>
  <rect x="948" y="674" width="76" height="28" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="986" y="693" fill="#9ca3af" font-size="12" font-weight="600" text-anchor="middle">Previous</text>
  <rect x="1032" y="674" width="56" height="28" rx="6" fill="#1f2937" stroke="#374151"/>
  <text x="1060" y="693" fill="#9ca3af" font-size="12" font-weight="600" text-anchor="middle">Next</text>

  <!-- Footer caption -->
  <text x="600" y="744" fill="#4b5563" font-size="11" text-anchor="middle">Website Monitoring Tool</text>
</svg>
