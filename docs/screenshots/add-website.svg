<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <rect width="1100" height="320" fill="#0b1220"/>

  <!-- Header strip -->
  <rect x="0" y="0" width="1100" height="56" fill="#111827"/>
  <rect x="0" y="55" width="1100" height="1" fill="#1f2937"/>
  <rect x="32" y="12" width="32" height="32" rx="7" fill="#4f46e5"/>
  <g stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(39,19)">
    <path d="M18 9A7 7 0 1 1 9 2"/>
    <path d="M18 2 9 11"/>
    <path d="M14 2h4v4"/>
  </g>
  <text x="76" y="28" fill="#f3f4f6" font-size="14" font-weight="600">Website Monitor</text>
  <text x="76" y="44" fill="#9ca3af" font-size="12">Track uptime and availability</text>

  <!-- Card -->
  <rect x="32" y="88" width="1036" height="200" rx="12" fill="#111827" stroke="#1f2937"/>
  <text x="56" y="120" fill="#f3f4f6" font-size="15" font-weight="600">Add a website</text>
  <text x="56" y="140" fill="#9ca3af" font-size="13">Paste a full URL to start monitoring its status.</text>

  <!-- Input with focus ring -->
  <rect x="56" y="160" width="800" height="42" rx="8" fill="#0b1220" stroke="#4f46e5" stroke-width="1.5"/>
  <g stroke="#9ca3af" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(70,173)">
    <path d="M8 10a4 4 0 0 0 6 0l2-2a4 4 0 0 0-6-6l-1 1"/>
    <path d="M11 8a4 4 0 0 0-6 0l-2 2a4 4 0 0 0 6 6l1-1"/>
  </g>
  <text x="98" y="186" fill="#e5e7eb" font-size="14">https://example.com</text>
  <!-- Caret -->
  <rect x="254" y="170" width="1.5" height="22" fill="#e5e7eb"/>

  <!-- Button -->
  <rect x="868" y="160" width="176" height="42" rx="8" fill="#4f46e5"/>
  <text x="956" y="186" fill="#fff" font-size="14" font-weight="600" text-anchor="middle">Add Website</text>

  <!-- Helper line (validation hint) -->
  <text x="56" y="232" fill="#9ca3af" font-size="12">Must begin with http:// or https:// — checked client-side before submission.</text>

  <!-- Success toast indicator -->
  <rect x="56" y="250" width="260" height="26" rx="13" fill="#14532d" fill-opacity="0.25" stroke="#22c55e" stroke-opacity="0.4"/>
  <circle cx="70" cy="263" r="3.5" fill="#4ade80"/>
  <text x="80" y="267" fill="#86efac" font-size="12" font-weight="600">Website added · table refreshed</text>
</svg>
